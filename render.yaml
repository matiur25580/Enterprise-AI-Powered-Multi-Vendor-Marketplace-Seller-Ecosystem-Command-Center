services:
    - type: web
    name: marketplace-api
    runtime: node
    rootDir: server
    buildCommand: npm install
    startCommand: node server.js
    envVars:
            - key: MONGO_URI
        sync: false
            - key: JWT_SECRET
        sync: false
            - key: EMAIL_USER
        sync: false
            - key: EMAIL_PASS
        sync: false
            - key: CLIENT_URL
        sync: false
